name: Build Miaki

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # Crucial: GitHub's runner, not yours

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y make git wget cmake python-is-python3 bzip2

    - name: Setup VitaSDK
      uses: vitasdk/setup-vitasdk@v1
      with:
        # This action handles the download and PATH for you
        vitasdk-version: latest

    - name: Build Miaki
      run: |
        make
      env:
        # The setup action sets VITASDK, but we ensure it's here
        VITASDK: ${{ env.VITASDK }}

    - name: Upload VPK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Miaki
        path: app/MIAKI.vpk
      if: github.event_name == 'push'
    
    - name: Create Draft Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        draft: true 
        tag_name: v${{ github.run_number }} 
        name: Miaki Draft Release v${{ github.run_number }}
        body: |
          Built from commit: ${{ github.sha }}
        files: |
          app/MIAKI.vpk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
