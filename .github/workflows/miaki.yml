name: Build Miaki

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y make git wget cmake python-is-python3 bzip2 \
                           autoconf texinfo bison flex libtool-bin

    - name: Install VitaSDK (via VDPM)
      run: |
        git clone https://github.com/vitasdk/vdpm
        cd vdpm
        ./bootstrap-vitasdk.sh
        ./install-all.sh
      env:
        VITASDK: /usr/local/vitasdk

    - name: Setup Environment Variables
      run: |
        echo "VITASDK=/usr/local/vitasdk" >> $GITHUB_ENV
        echo "PATH=/usr/local/vitasdk/bin:$PATH" >> $GITHUB_ENV

    - name: Build Miaki
      run: |
        make
      # Ensure make uses the variables we just set
      env:
        VITASDK: /usr/local/vitasdk

    - name: Upload VPK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Miaki-VPK
        path: app/MIAKI.vpk
      if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    - name: Create Draft Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
      uses: softprops/action-gh-release@v2
      with:
        draft: true 
        tag_name: v${{ github.run_number }} 
        name: Miaki Draft Release v${{ github.run_number }}
        body: "Built from commit: ${{ github.sha }}"
        files: app/MIAKI.vpk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
